name: Build skill plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (leave blank to use skill-catalog.json)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve package version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = (os.environ.get('REQUESTED_VERSION') or json.loads(Path('skill-catalog.json').read_text())['package_version']).removeprefix('v')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Package version must be MAJOR.MINOR.PATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'value={version}\n')
          PY
      - name: Build all five formats
        id: packages
        uses: ./.github/actions/build-skill-plugins
        with:
          source: .
          config: plugin-bundles.yml
          output: dist/skill-plugins
          targets: copilot,chatgpt,claude,gemini-app,gemini-cli
          version: ${{ steps.version.outputs.value }}
      - name: Test the packager
        run: python -m unittest discover -s .github/actions/build-skill-plugins/tests -v
      - name: Upload packages and installation guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: teacher-workbench-plugins-${{ steps.version.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/skill-plugins/archives/*.zip
            dist/skill-plugins/build-report.json
            dist/skill-plugins/SHA256SUMS
            dist/skill-plugins/GEMINI-INSTALL.md
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Rebuild the same tagged source to produce deterministic release assets.
      - uses: ./.github/actions/build-skill-plugins
        with:
          source: .
          config: plugin-bundles.yml
          output: dist/skill-plugins
          targets: copilot,chatgpt,claude,gemini-app,gemini-cli
          version: ${{ needs.build.outputs.version }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --verify-tag --draft --generate-notes \
            --title "Teacher Workbench plugins $RELEASE_TAG" \
            dist/skill-plugins/archives/*.zip \
            dist/skill-plugins/build-report.json \
            dist/skill-plugins/SHA256SUMS \
            dist/skill-plugins/GEMINI-INSTALL.md
